# Linux control-plane deployment settings.
# Copy to $RSIM_HOME/config/deployment.yaml on each server. These values are
# infrastructure-owned and are intentionally absent from user simulation YAML.
cluster:
  # Deployment-only direct data-plane namespaces.  The client root is sent
  # only inside an owner/Stage-bound TransferPlan; the server probe root is
  # used by Linux for bounded logical-reference checks.  Neither value is
  # part of the user's simulation YAML.
  direct_transfer:
    client_target_root: "\\\\cluster-host\\rsim-share\\staging"
    server_probe_root: "/mnt/cluster/rsim-share/staging"
  linux_mount_map:
    "\\\\abtvdfs2.de.bosch.com\\ismdfs": "/mnt/cluster"
    "\\\\szhradar01\\_CLUSTER_SOFTWARE": "/mnt/cluster_sw"
